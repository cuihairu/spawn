version: "3.9"

services:
  api-gateway:
    build:
      context: ./services/api-gateway
    environment:
      USER_SERVICE_URL: http://user-service:8888
      GAME_SERVICE_URL: http://game-catalog:8890
      CONTENT_SERVICE_URL: http://content-service:8891
      COMMUNITY_SERVICE_URL: http://community:8892
      DATA_PANEL_URL: http://data-panel:8896
      # 与 user-service 的 Auth.JWTSecret 同值：上传入口网关本地校验 JWT。
      # 默认值为仓库内置演示密钥（服务启动期会告警）；生产必须以宿主环境
      # 变量 JWT_SECRET / REALTIME_INTERNAL_TOKEN 覆盖。
      JWT_SECRET: "${JWT_SECRET:-tappi-user-service-jwt-secret-key-2024}"
      # realtime-hub WS 隧道：/ws 原始透传（未配置则网关不注册 /ws）。
      REALTIME_HUB_URL: http://realtime-hub:8893
      # GP-201 Courier 适配服务（游戏会话票据/绑定/映射管理面）
      COURIER_ADAPTER_URL: http://courier-adapter:8897
    volumes:
      - uploads:/app/uploads
    depends_on:
      - user-service
      - game-catalog
      - content-service
      - community
      - data-panel
      - realtime-hub
      - courier-adapter
    ports:
      - "8800:8800"
      - "9095:9095" # /metrics（deploy/ 观测栈抓取）
    restart: unless-stopped

  game-catalog:
    build:
      context: ./services/game-catalog
    environment:
      # GP-105 包体托管目录：持久卷，受控下载/合作方上传共用；
      # 生产纳入备份（接入设计 §4）。
      PACKAGE_DIR: /app/data/packages
    volumes:
      - game-packages:/app/data/packages
    ports:
      - "8890:8890"
      - "9092:9092" # /metrics（deploy/ 观测栈抓取）
    restart: unless-stopped

  content-service:
    build:
      context: ./services/content-service
    environment:
      JWT_SECRET: "${JWT_SECRET:-tappi-user-service-jwt-secret-key-2024}"
      GAMECATALOG_BASE_URL: http://game-catalog:8890
      GAMECATALOG_TIMEOUT: "5000"
    ports:
      - "8891:8891"
      - "9093:9093" # /metrics（deploy/ 观测栈抓取）
    restart: unless-stopped

  user-service:
    build:
      context: ./services/user-service
    environment:
      DATASOURCE: file:/app/data/users.db
      GAMECATALOG_BASE_URL: http://game-catalog:8890
      GAMECATALOG_TIMEOUT: "5000"
      JWT_SECRET: "${JWT_SECRET:-tappi-user-service-jwt-secret-key-2024}"
    depends_on:
      - game-catalog
    ports:
      - "8888:8888"
      - "9091:9091" # /metrics（deploy/ 观测栈抓取）
    restart: unless-stopped

  community:
    build:
      context: ./services/community
    environment:
      JWT_SECRET: "${JWT_SECRET:-tappi-user-service-jwt-secret-key-2024}"
      # realtime-hub 未就绪时 community 启动不受影响（发布失败仅记日志）。
      REALTIME_HUB_URL: http://realtime-hub:8893
      REALTIME_INTERNAL_TOKEN: "${REALTIME_INTERNAL_TOKEN:-tappi-realtime-internal-token-2024}"
    depends_on:
      - realtime-hub
    ports:
      - "8892:8892"
      - "9094:9094" # /metrics（deploy/ 观测栈抓取）
    restart: unless-stopped

  data-panel:
    build:
      context: ./services/data-panel
    environment:
      # 与 user-service 的 Auth.JWTSecret 同值：战绩摄入 Bearer 校验。
      JWT_SECRET: "${JWT_SECRET:-tappi-user-service-jwt-secret-key-2024}"
    ports:
      - "8896:8896"
      - "9097:9097" # /metrics（deploy/ 观测栈抓取）
    restart: unless-stopped

  realtime-hub:
    build:
      context: ./services/realtime-hub
    environment:
      # 与 user-service 的 Auth.JWTSecret 同值：/ws 握手 JWT 校验。
      JWT_SECRET: "${JWT_SECRET:-tappi-user-service-jwt-secret-key-2024}"
      # 服务间发布令牌（community 等调用方携带 X-Internal-Token）。
      REALTIME_INTERNAL_TOKEN: "${REALTIME_INTERNAL_TOKEN:-tappi-realtime-internal-token-2024}"
    ports:
      - "8893:8893"
    restart: unless-stopped

  # GP-201 Courier 适配服务：平台账号 ↔ Courier 游戏会话（绑定/代登录/
  # 启动票据/注销同步）+ courier_game_mapping 管理面。Courier 网关本身
  # 属另一仓（GP-005 联合沙箱接线），未就绪时本服务可启动，游戏会话端点
  # 以 502 呈现上游不可达。
  courier-adapter:
    build:
      context: ./services/courier-adapter
    environment:
      # 与 user-service 的 Auth.JWTSecret 同值：平台 JWT 校验。
      JWT_SECRET: "${JWT_SECRET:-tappi-user-service-jwt-secret-key-2024}"
      # 代登录随机密码加密密钥：生产必须覆盖（内置演示值启动期大声告警）。
      CREDENTIAL_KEY: "${CREDENTIAL_KEY:-tappi-courier-adapter-credential-key-2026}"
      COURIER_GATEWAY_URL: "${COURIER_GATEWAY_URL:-http://courier-gateway:8080}"
      GAMECATALOG_BASE_URL: http://game-catalog:8890
      USER_SERVICE_URL: http://user-service:8888
    depends_on:
      - user-service
      - game-catalog
    ports:
      - "8897:8897"
      - "9098:9098" # /metrics（deploy/ 观测栈抓取）
    restart: unless-stopped

  web-client:
    build:
      context: ./apps/web-client
      args:
        VITE_USER_SERVICE_URL: http://localhost:8888
        VITE_GAME_SERVICE_URL: http://localhost:8890
        VITE_CONTENT_SERVICE_URL: http://localhost:8891
        VITE_COMMUNITY_SERVICE_URL: http://localhost:8892
        VITE_API_GATEWAY_URL: http://localhost:8800
    ports:
      - "4173:80"
    depends_on:
      - game-catalog
      - user-service
      - api-gateway
      - content-service
      - community
      - data-panel
      - realtime-hub
    restart: unless-stopped

volumes:
  uploads:
  game-packages:
