version: "3.9"

services:
  api-gateway:
    build:
      context: ./services/api-gateway
    environment:
      USER_SERVICE_URL: http://user-service:8888
      GAME_SERVICE_URL: http://game-catalog:8890
      CONTENT_SERVICE_URL: http://content-service:8891
    depends_on:
      - user-service
      - game-catalog
      - content-service
    ports:
      - "8800:8800"
    restart: unless-stopped

  game-catalog:
    build:
      context: ./services/game-catalog
    ports:
      - "8890:8890"
    restart: unless-stopped

  content-service:
    build:
      context: ./services/content-service
    ports:
      - "8891:8891"
    restart: unless-stopped

  user-service:
    build:
      context: ./services/user-service
    environment:
      DATASOURCE: file:/app/data/users.db
      GAMECATALOG_BASE_URL: http://game-catalog:8890
      GAMECATALOG_TIMEOUT: "5000"
      JWT_SECRET: tappi-user-service-jwt-secret-key-2024
    depends_on:
      - game-catalog
    ports:
      - "8888:8888"
    restart: unless-stopped

  web-client:
    build:
      context: ./apps/web-client
      args:
        VITE_USER_SERVICE_URL: http://user-service:8888
        VITE_GAME_SERVICE_URL: http://game-catalog:8890
        VITE_API_GATEWAY_URL: http://api-gateway:8800
    ports:
      - "4173:80"
    depends_on:
      - game-catalog
      - user-service
      - api-gateway
      - content-service
    restart: unless-stopped
