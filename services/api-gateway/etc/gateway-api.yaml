Name: api-gateway
Host: 0.0.0.0
Port: 8800

# 全局超时：go-zero rest 默认 3 s 会经请求 context 掐断 GP-105 流式包体
# 通道（StreamingHandler 继承 r.Context()，上游 streamClient 本身无整体
# 超时）——2026-11-26 模拟器走查实测 200 MiB 下载稳定在 3301 ms 被切
# （okhttp unexpected end of stream），宿主机 curl 0.6 s 完成故未暴露。
# 放大到 5 min 与 game-catalog 侧口径一致；JSON 请求按实际处理时长提前
# 返回，不受影响。
Timeout: 300000

# 请求体上限：go-zero rest 默认 10 MiB 会在框架层 413 掐掉 GP-105 合作方
# 包体上传（POST /partner/games/:id/versions/:versionId/package 流式透传；
# 2026-11-26 走查 30 MiB 实测 413）。放开到与 game-catalog 包体存储上限
# 对齐（2 GiB）；JSON 反代路由另有 1 MiB maxProxyBody 自身兜底。
MaxBytes: 2147483648

# 上传入口的 JWT 本地校验：secret 与 user-service 的 Auth.JWTSecret 保持一致，
# 部署面可用 JWT_SECRET 环境变量覆盖（compose 里两端同步传值）。
Auth:
  JWTSecret: "tappi-user-service-jwt-secret-key-2024"

# 统一上传入口：图片落本地盘（选型方案 A），容器内挂 uploads 卷。
Upload:
  Dir: "./uploads"
  MaxBytes: 10485760

Upstreams:
  UserService:
    BaseURL: "http://localhost:8888"
    Timeout: 5000
  GameCatalog:
    BaseURL: "http://localhost:8890"
    Timeout: 5000
  Content:
    BaseURL: "http://localhost:8891"
    Timeout: 5000
  Community:
    BaseURL: "http://localhost:8892"
    Timeout: 5000
  DataPanel:
    BaseURL: "http://localhost:8896"
    Timeout: 5000
  # realtime-hub WS 隧道：/ws 原始透传（未配置则网关不注册 /ws）。
  RealtimeHub:
    BaseURL: "http://localhost:8893"
    Timeout: 5000
  # GP-201 Courier 适配服务：游戏会话票据/绑定/注销同步/映射管理面
  # （未配置则网关不注册该组路由）。
  CourierAdapter:
    BaseURL: "http://localhost:8897"
    Timeout: 5000
  # GP-202 支付接入服务：商品配置/下单/订单查询/回调验签接缝
  # （未配置则网关不注册该组路由）。
  Payments:
    BaseURL: "http://localhost:8898"
    Timeout: 5000
  # GP-301 活动/促销配置服务：活动状态机/版本快照管理面
  # （未配置则网关不注册该组路由）。
  Promotions:
    BaseURL: "http://localhost:8902"
    Timeout: 5000

# Prometheus 指标端点（go-zero agent 自动暴露 /metrics）
Prometheus:
  Host: 0.0.0.0
  Port: 9095

# 结构化日志（go-zero logx）：JSON 单行输出到容器 stdout，
# 由 deploy/docker-compose.monitoring.yaml 的 Promtail 集中收集进 Loki
Log:
  ServiceName: api-gateway
  Mode: console
  Encoding: json
  Level: info
