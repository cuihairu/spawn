Name: api-gateway
Host: 0.0.0.0
Port: 8800

Upstreams:
  UserService:
    BaseURL: "http://localhost:8888"
    Timeout: 5000
  GameCatalog:
    BaseURL: "http://localhost:8890"
    Timeout: 5000
  Content:
    BaseURL: "http://localhost:8891"
    Timeout: 5000
  Community:
    BaseURL: "http://localhost:8892"
    Timeout: 5000

# Prometheus 指标端点（go-zero agent 自动暴露 /metrics）
Prometheus:
  Host: 0.0.0.0
  Port: 9095

# 结构化日志（go-zero logx）：JSON 单行输出到容器 stdout，
# 由 deploy/docker-compose.monitoring.yaml 的 Promtail 集中收集进 Loki
Log:
  ServiceName: api-gateway
  Mode: console
  Encoding: json
  Level: info
