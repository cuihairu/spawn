Name: community-api
Host: 0.0.0.0
Port: 8892
Timeout: 30000

# 社区数据库：DSN 含 file:/.db 走 SQLite（默认本地文件，零配置），
# 生产用 MySQL 连接串 + DATASOURCE 环境变量覆盖。空表启动时自动写入内嵌种子。
MySQL:
  DataSource: "file:data/community.db"

# JWT 校验密钥（与 user-service 共享；生产环境用 JWT_SECRET 环境变量覆盖）
Auth:
  JWTSecret: tappi-user-service-jwt-secret-key-2024

# 内容审核：BlockedWords 空则用内置默认敏感词表（命中即拒绝发帖/评论）；
# AdminUserIds 为审核管理员允许名单（举报队列查看与处置）。
# 1 = 首个注册账号，演示用；生产建议显式指定并收紧。
Moderation:
  BlockedWords: []
  AdminUserIds: [1]

# Prometheus 指标端点（go-zero agent 自动暴露 /metrics）
Prometheus:
  Host: 0.0.0.0
  Port: 9094

# 结构化日志（go-zero logx）：JSON 单行输出到容器 stdout，
# 由 deploy/docker-compose.monitoring.yaml 的 Promtail 集中收集进 Loki
Log:
  ServiceName: community-api
  Mode: console
  Encoding: json
  Level: info
