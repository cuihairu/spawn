Name: game-catalog-api
Host: 0.0.0.0
Port: 8890

# HTTP 请求体上限：go-zero rest 默认 1 MiB，会把合作方包体上传（GP-105
# 上限 2 GiB，见 store.MaxPackageBytes）在框架层 413 截断——2026-11-26
# 走查 200 MiB 包上传实测。此处放开到与包体存储上限对齐；JSON 管理面
# 请求体远小于此值，网关侧另有流式通道与限流（api-gateway）兜底。
MaxBytes: 2147483648

# 游戏目录数据库：DSN 含 file:/.db 走 SQLite（默认本地文件，零配置），
# 生产用 MySQL 连接串 + DATASOURCE 环境变量覆盖。空表启动时自动写入内嵌种子。
MySQL:
  DataSource: "file:data/games.db"

# JWT 校验密钥（与 user-service 共享；生产环境用 JWT_SECRET 环境变量覆盖）
Auth:
  JWTSecret: "tappi-user-service-jwt-secret-key-2024"

# 包体存储（GP-105 受控下载）：本地磁盘目录托管渠道包，生产挂持久卷并纳入
# 备份（接入设计 §4）；容器内由 PACKAGE_DIR 环境变量覆盖。
Package:
  Dir: "data/packages"

# Prometheus 指标端点（go-zero agent 自动暴露 /metrics）
Prometheus:
  Host: 0.0.0.0
  Port: 9092

# 结构化日志（go-zero logx）：JSON 单行输出到容器 stdout，
# 由 deploy/docker-compose.monitoring.yaml 的 Promtail 集中收集进 Loki
Log:
  ServiceName: game-catalog-api
  Mode: console
  Encoding: json
  Level: info
