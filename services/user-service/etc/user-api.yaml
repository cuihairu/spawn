Name: user-api
Host: 0.0.0.0
Port: 8888

# 数据库配置
MySQL:
  DataSource: "root:root123@tcp(localhost:3306)/tappi?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai"

# JWT 配置
Auth:
  JWTSecret: "tappi-user-service-jwt-secret-key-2024"
  TokenExpire: 7

Services:
  GameCatalog:
    BaseURL: "http://localhost:8890"
    Timeout: 5000
    # GP-403 渠道归因 S2S 令牌：须与 game-catalog 的 INTERNAL_TOKEN 一致。
    # 留空 = 点击解析 403，注册按自然流量处理（不影响注册本身）。
    InternalToken: ""

# Prometheus 指标端点（go-zero agent 自动暴露 /metrics）
Prometheus:
  Host: 0.0.0.0
  Port: 9091

# 结构化日志（go-zero logx）：JSON 单行输出到容器 stdout，
# 由 deploy/docker-compose.monitoring.yaml 的 Promtail 集中收集进 Loki
Log:
  ServiceName: user-api
  Mode: console
  Encoding: json
  Level: info
