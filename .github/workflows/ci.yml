# CI 流水线：对 go.work 声明的全部模块执行 gofmt / build / test(-race) 门禁。
# 模块列表从 go.work 动态读取（go work edit -json），新增服务无需改此文件。
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gofmt + build + test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Report modules
        run: |
          go work edit -json | jq -r '.Use[].DiskPath' | sed 's/^/module: /'

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build all modules
        run: |
          status=0
          for m in $(go work edit -json | jq -r '.Use[].DiskPath'); do
            echo "::group::build $m"
            (cd "$m" && go build ./...) || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Test all modules (-race)
        run: |
          status=0
          for m in $(go work edit -json | jq -r '.Use[].DiskPath'); do
            echo "::group::test $m"
            (cd "$m" && go test ./... -race -count=1) || status=1
            echo "::endgroup::"
          done
          exit $status

  mobile:
    name: web + mobile lint + typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Web typecheck (tsc -b)
        run: pnpm web:typecheck

      - name: Web lint (eslint)
        run: pnpm web:lint

      - name: Mobile typecheck (tsc --noEmit)
        run: pnpm mobile:typecheck

      - name: Mobile lint (eslint)
        run: pnpm mobile:lint
