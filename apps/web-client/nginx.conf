# SPA 静态托管：BrowserRouter 深链（/discover、/community/posts/1 等）
# 直接命中或刷新时回退到 index.html 交客户端路由，否则一律 404。
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    # 文件名带内容哈希，可长缓存
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
